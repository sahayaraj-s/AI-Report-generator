services:
  - type: web
    name: skillbay-placement-backend
    runtime: python
    rootDir: backend
    plan: standard
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEV_MODE
        value: "False"
      - key: DATABASE_URL
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL_DEFAULT
        value: gemini-3.6-flash
      - key: GEMINI_MODEL_FAST
        value: gemini-3.5-flash-lite
      - key: GEMINI_MODEL_DEEP
        value: gemini-2.5-pro
      - key: GEMINI_FALLBACKS
        value: "gemini-3.5-flash,gemini-3.1-flash-lite"
      - key: GEMINI_TIMEOUT_SECONDS
        value: "8.0"

      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
